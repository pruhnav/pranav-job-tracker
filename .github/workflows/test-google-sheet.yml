name: Run SponsorScan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sponsorscan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SponsorScan database cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: sponsorscan.db
          key: sponsorscan-db-fy2026-q2-v1

      - name: Download LCA data
        if: steps.db-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download lca-fy2026-q2 --dir .
          echo "Downloaded files:"
          ls -lah

      - name: Build LCA database
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: |
          python sponsorscan.py load-lca "LCA_Disclosure_Data_FY2026_Q2.xlsx" --replace

      - name: Fetch current jobs
        run: |
          python sponsorscan.py fetch-jobs --replace

      - name: Generate personalized 48-hour report
        run: |
          python sponsor_daily_report.py \
            --hours 48 \
            --out pranav_matches_48h.csv \
            --new-out todays_new_jobs_48h.csv \
            --top 50

      - name: Upload report CSV files
        uses: actions/upload-artifact@v4
        with:
          name: pranav-job-reports
          path: |
            pranav_matches_48h.csv
            todays_new_jobs_48h.csv
          retention-days: 14

      - name: Save updated job history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .sponsorscan_pranav_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update SponsorScan job state"
            git push
          fi